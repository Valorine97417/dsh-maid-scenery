# dsh-maid-scenery bundle patch
# 融合层：插本插件自身行 + maid-atelier 主题行（主题是本包依赖，行由这里解析）。
# dsh-video-skin 不在此列——它缺席时本插件全部规则自动失效（:has 条件化），
# 在场时由老大 profile 自行管理，避免重复 insert。
- insert:
    - id: maid-scenery
      name: 'dsh-maid-scenery'
    - id: ui-skin-maid-atelier
      name: '@dsh-external/dsh-client-ui-skin-maid-atelier'
